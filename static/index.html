<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TamiChat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login">
  <h2>TamiChat 单聊</h2>
  <input id="username" placeholder="输入你的用户名" autocomplete="off">
  <button onclick="login()">进入</button>
</div>

<div id="chat" class="hidden">
  <aside>
    <div class="me">我：<span id="me"></span></div>
    <div class="label">在线用户</div>
    <ul id="users"></ul>
  </aside>
  <main>
    <header id="peer">选择左侧用户开始聊天</header>
    <div id="messages"></div>
    <form id="send-form">
      <input id="input" placeholder="输入消息..." autocomplete="off" disabled>
      <button type="submit" disabled>发送</button>
    </form>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
